services:
  - type: web
    name: fish-backend
    runtime: python
    rootDir: backend
    buildCommand: pip install -r requirements.txt
    startCommand: uvicorn app:app --host 0.0.0.0 --port $PORT
    plan: free
    envVars:
      - key: JWT_SECRET_KEY
        generateValue: true
      - key: ADMIN_PASSWORD
        value: admin123
